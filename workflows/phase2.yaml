name: software_factory
version: 2
substrate_version: "0.1.0"
extends: ./phase1.yaml

roles:
  - name: test_author
  - name: implementer

transitions:
  - name: claim
    from: new
    allowed_roles__append: [test_author, implementer]
  - name: submit
    from: in_progress
    allowed_roles__append: [test_author, implementer]
  - name: cannot_proceed
    from: in_progress
    allowed_roles__append: [test_author, implementer]
  - name: release
    from: in_progress
    allowed_roles__append: [test_author, implementer]
  - name: channel_fail
    from: in_progress
    allowed_roles__append: [test_author, implementer]

work_item_types:
  - name: test_suite
    custom_fields:
      - name: spec_section
        type: string
        required: true
        ui_visible: true
      - name: ac_ids
        type: json
        required: true
        ui_visible: true
      - name: module_name
        type: string
        required: false
        ui_visible: true
      - name: interface_ref
        type: work_item_ref
        target_work_item_type: interface_spec
        required: true
        ui_visible: true
      - name: dependency_refs
        type: json
        required: false
        ui_visible: true
      - name: artifact_path
        type: string
        ui_visible: true
      - name: artifact_hash
        type: string
        ui_visible: false
      - name: diagnostics
        type: json
        ui_visible: false

  - name: implementation
    custom_fields:
      - name: spec_section
        type: string
        required: true
        ui_visible: true
      - name: ac_ids
        type: json
        required: true
        ui_visible: true
      - name: module_name
        type: string
        required: false
        ui_visible: true
      - name: interface_ref
        type: work_item_ref
        target_work_item_type: interface_spec
        required: true
        ui_visible: true
      - name: test_suite_ref
        type: work_item_ref
        target_work_item_type: test_suite
        required: true
        ui_visible: true
      - name: dependency_refs
        type: json
        required: false
        ui_visible: true
      - name: artifact_path
        type: string
        ui_visible: true
      - name: artifact_hash
        type: string
        ui_visible: false
      - name: diagnostics
        type: json
        ui_visible: false

link_types:
  - name: implements
    source_type: implementation
    target_type: interface_spec
  - name: tested_by
    source_type: implementation
    target_type: test_suite
  - name: derived_from
    source_type: test_suite
    target_type: interface_spec

attempt_threshold: 3
