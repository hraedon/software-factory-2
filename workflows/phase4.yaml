name: software_factory
version: 4
substrate_version: "0.1.0"
extends: ./phase3.yaml

roles:
  - name: cross_family_reviewer
  - name: frontier_judge

transitions:
  - name: claim
    from: new
    allowed_roles__append: [cross_family_reviewer, frontier_judge]
  - name: submit
    from: in_progress
    allowed_roles__append: [cross_family_reviewer, frontier_judge]
  - name: cannot_proceed
    from: in_progress
    allowed_roles__append: [cross_family_reviewer, frontier_judge]
  - name: release
    from: in_progress
    allowed_roles__append: [cross_family_reviewer, frontier_judge]
  - name: channel_fail
    from: in_progress
    allowed_roles__append: [cross_family_reviewer, frontier_judge]

work_item_types:
  - name: review
    custom_fields:
      - name: spec_section
        type: string
        required: true
        ui_visible: true
      - name: ac_ids
        type: json
        required: true
        ui_visible: true
      - name: module_name
        type: string
        required: false
        ui_visible: true
      - name: interface_ref
        type: work_item_ref
        target_work_item_type: interface_spec
        required: true
        ui_visible: true
      - name: test_suite_ref
        type: work_item_ref
        target_work_item_type: test_suite
        required: true
        ui_visible: true
      - name: implementation_ref
        type: work_item_ref
        target_work_item_type: implementation
        required: true
        ui_visible: true
      - name: dependency_refs
        type: json
        required: false
        ui_visible: true
      - name: artifact_path
        type: string
        ui_visible: true
      - name: artifact_hash
        type: string
        ui_visible: false
      - name: diagnostics
        type: json
        ui_visible: false

  - name: jury
    custom_fields:
      - name: spec_section
        type: string
        required: false
        ui_visible: true
      - name: ac_ids
        type: json
        required: false
        ui_visible: true
      - name: module_name
        type: string
        required: false
        ui_visible: true
      - name: review_ref
        type: work_item_ref
        target_work_item_type: review
        required: true
        ui_visible: true
      - name: dependency_refs
        type: json
        required: false
        ui_visible: true
      - name: artifact_path
        type: string
        ui_visible: true
      - name: artifact_hash
        type: string
        ui_visible: false
      - name: diagnostics
        type: json
        ui_visible: false

link_types:
  - name: reviews
    source_type: review
    target_type: implementation
  - name: judges
    source_type: jury
    target_type: review

attempt_threshold: 3
