name: software_factory
version: 5
substrate_version: "0.1.0"
extends: ./phase4.yaml

roles:
  - name: integrator
  - name: outcome_verifier

transitions:
  - name: claim
    from: new
    allowed_roles__append: [integrator, outcome_verifier]
  - name: submit
    from: in_progress
    allowed_roles__append: [integrator, outcome_verifier]
  - name: cannot_proceed
    from: in_progress
    allowed_roles__append: [integrator, outcome_verifier]
  - name: release
    from: in_progress
    allowed_roles__append: [integrator, outcome_verifier]
  - name: channel_fail
    from: in_progress
    allowed_roles__append: [integrator, outcome_verifier]

work_item_types:
  - name: integration
    custom_fields:
      - name: spec_section
        type: string
        required: true
        ui_visible: true
      - name: ac_ids
        type: json
        required: true
        ui_visible: true
      - name: module_name
        type: string
        required: false
        ui_visible: true
      - name: artifact_path
        type: string
        ui_visible: true
      - name: artifact_hash
        type: string
        ui_visible: false
      - name: diagnostics
        type: json
        ui_visible: false
      - name: supersedes_ref
        type: work_item_ref
        target_work_item_type: integration
        required: false
        ui_visible: true
      - name: integration_ref
        type: work_item_ref
        target_work_item_type: jury
        required: false
        ui_visible: true

  - name: outcome_verification
    custom_fields:
      - name: spec_section
        type: string
        required: true
        ui_visible: true
      - name: ac_ids
        type: json
        required: true
        ui_visible: true
      - name: module_name
        type: string
        required: false
        ui_visible: true
      - name: integration_ref
        type: work_item_ref
        target_work_item_type: integration
        required: true
        ui_visible: true
      - name: artifact_path
        type: string
        ui_visible: true
      - name: artifact_hash
        type: string
        ui_visible: false
      - name: diagnostics
        type: json
        ui_visible: false

link_types:
  - name: integrates
    source_type: integration
    target_type: jury
  - name: verified_by
    source_type: outcome_verification
    target_type: integration
  - name: supersedes
    source_type: integration
    target_type: integration

attempt_threshold: 3
