        type: string
        ui_visible: true
      - name: artifact_hash
        type: string
        ui_visible: false
      - name: diagnostics
        type: json
        ui_visible: false

link_types:
  - name: implements
    source_type: implementation
    target_type: interface_spec
  - name: tested_by
    source_type: implementation
    target_type: test_suite
  - name: derived_from
    source_type: test_suite
    target_type: interface_spec
  - name: reviews
    source_type: review
    target_type: implementation
  - name: judges
    source_type: jury
    target_type: review
  - name: derived_from
    source_type: integration
    target_type: implementation
  - name: supersedes
    source_type: integration
    target_type: integration
  - name: derived_from
    source_type: outcome_verification
    target_type: integration

attempt_threshold: 3
