        type: string
        required: false
        ui_visible: true
      - name: ac_ids
        type: json
        required: false
        ui_visible: true
      - name: module_name
        type: string
        required: false
        ui_visible: true
      - name: review_ref
        type: work_item_ref
        target_work_item_type: review
        required: true
        ui_visible: true
      - name: dependency_refs
        type: json
        required: false
        ui_visible: true
      - name: artifact_path
        type: string
        ui_visible: true
      - name: artifact_hash
        type: string
        ui_visible: false
      - name: diagnostics
        type: json
        ui_visible: false

  - name: integration
    custom_fields:
      - name: spec_section
        type: string
        required: true
        ui_visible: true
      - name: ac_ids
        type: json
        required: true
        ui_visible: true
      - name: module_name
        type: string
        required: false
        ui_visible: true
      - name: artifact_path
        type: string
        ui_visible: true
      - name: artifact_hash
        type: string
        ui_visible: false
      - name: diagnostics
        type: json
        ui_visible: false
      - name: supersedes_ref
        type: work_item_ref
        target_work_item_type: integration
        required: false
